# ==============================================================================
# Docker Compose Local Override Configuration
# Adds local PostgreSQL service, persistent volume, and health check.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: prompt_rewriter_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prompt_rewriter}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-prompt_rewriter}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prompt_rewriter}

volumes:
  pgdata:
    name: prompt_rewriter_pgdata
