# ==============================================================================
# Base Docker Compose Configuration (External Database)
# Does NOT contain PostgreSQL service. Connects to external PostgreSQL via DATABASE_URL.
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prompt_rewriter_app
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_PORT=${API_PORT:-3000}
      - PUBLIC_APP_ORIGIN=${PUBLIC_APP_ORIGIN}
      - OPENAI_ANALYZER_MODEL=${OPENAI_ANALYZER_MODEL}
      - OPENAI_ARCHITECT_MODEL=${OPENAI_ARCHITECT_MODEL}
      - OPENAI_COMPOSER_MODEL=${OPENAI_COMPOSER_MODEL}
      - OPENAI_REVIEWER_MODEL=${OPENAI_REVIEWER_MODEL}
      - OPENAI_FAST_MODEL=${OPENAI_FAST_MODEL}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS}
      - AI_RETRY_LIMIT=${AI_RETRY_LIMIT}
      - AI_REQUEST_TIMEOUT_MS=${AI_REQUEST_TIMEOUT_MS}
      - AI_MAX_JOB_COST=${AI_MAX_JOB_COST}
      - LOG_LEVEL=${LOG_LEVEL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
